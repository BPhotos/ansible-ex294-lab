---
- name: Instalar nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: activar nginx
  ansible.builtin.service:
    name: nginx
    enabled: true

- name: Arrancar nginx
  ansible.builtin.service:
    name: nginx 
    state: started

- name: Crear pagina web desde template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: reinicia nginx
